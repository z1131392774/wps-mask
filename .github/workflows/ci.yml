name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the gate compares the last commit per file
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check documentation invariants
        run: npm run check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cipher and engine
        run: |
          node wps-mask-addon/test/aes.test.js
          node wps-mask-addon/test/engine.test.js
      - name: Task pane
        run: |
          npm i jsdom --no-save
          node wps-mask-addon/test/taskpane.test.js
