<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>数据脱敏映射</title>
    <link rel="stylesheet" href="./taskpane.css">
</head>

<body>
    <div class="hd">
        <div class="hd-top">
            <span class="ttl">数据脱敏映射</span>
            <button id="btnRefresh" class="ghost" title="重新读取当前选区">刷新选区</button>
        </div>
        <div id="selInfo" class="sub">正在读取选区…</div>
    </div>

    <div class="bar">
        <label class="chk"><input type="checkbox" id="chkHeader"> 首行是表头</label>
        <button id="btnAuto" class="ghost">重新识别</button>
    </div>

    <div id="cards" class="cards"></div>

    <div class="ft">
        <div class="btns">
            <button id="btnMask" class="primary">映射并写入</button>
            <button id="btnRevert">反映射回原值</button>
        </div>
        <div id="status" class="status"></div>
        <div class="links">
            <a href="javascript:void(0)" id="btnDrop">清除本文档映射表</a>
            <a href="javascript:void(0)" id="btnHelp">使用说明</a>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/aes.js"></script>
    <script src="../js/engine.js"></script>
    <script src="./taskpane.js"></script>
</body>

</html>
