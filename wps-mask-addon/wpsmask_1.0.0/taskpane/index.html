<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>数据脱敏映射</title>
    <link rel="stylesheet" href="./taskpane.css">
</head>

<body>
    <div class="hd">
        <div class="hd-top">
            <span class="ttl">数据脱敏映射</span>
            <button id="btnRefresh" class="ghost" title="重新读取当前选区">刷新选区</button>
        </div>
        <div id="selInfo" class="sub">正在读取选区…</div>
    </div>

    <div class="bar">
        <label class="chk"><input type="checkbox" id="chkHeader"> 首行是表头</label>
        <span class="bar-r">
            <button id="btnExpand" class="ghost" title="展开或收起所有列的参数">展开全部</button>
            <button id="btnAuto" class="ghost" title="忽略本文档上次记住的设置，按数据类型重新判断">重新识别</button>
        </span>
    </div>

    <div id="cards" class="cards"></div>

    <div class="ft">
        <div class="btns">
            <button id="btnMask" class="primary">映射并写入</button>
            <button id="btnRevert">反映射回原值</button>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div class="links">
            <a href="javascript:void(0)" id="btnDrop" class="danger">清除本文档映射表</a>
            <a href="javascript:void(0)" id="btnHelp">使用说明</a>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/aes.js"></script>
    <script src="../js/engine.js"></script>
    <script src="./taskpane.js"></script>
</body>

</html>
